<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="../shared/nav-sync.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo — Estrutura do menu — Nivelo</title>

  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../../Storybook-Nivelo/src/tokens/tokens.css" />
  <link rel="stylesheet" href="../../Storybook-Nivelo/src/tokens/typography.css" />
  <link rel="stylesheet" href="../../Storybook-Nivelo/src/components/Button/Button.module.css" />
  <link rel="stylesheet" href="../shared/page-admin-shell.css" />
</head>
<body>

  <div class="app-shell" id="app-shell">

    <!-- ══════════════════ HEADER ══════════════════ -->
    <header class="app-header">
      <div class="app-header-left">
        <button type="button" class="app-header-hamburger" id="hamburger-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="app-sidebar">
          <i data-lucide="menu" width="22" height="22"></i>
        </button>

        <div class="app-header-brand">
          <img class="app-header-logo" src="../../NIVELO azul header sistema.svg" alt="Nivelo" />
          <span class="app-header-tagline">Painel administrativo</span>
        </div>
      </div>
    </header>

    <div class="app-body">

      <div class="app-sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- ══════════════════ SIDEBAR ══════════════════ -->
      <aside class="app-sidebar" id="app-sidebar" aria-label="Navegação principal">
        <button type="button" class="app-sidebar-toggle" id="sidebar-toggle-btn" aria-label="Retrair menu" aria-expanded="true">
          <i class="app-sidebar-toggle-icon" data-lucide="chevron-left" width="16" height="16"></i>
        </button>

        <nav class="app-sidebar-body">

          <div class="app-nav-section">
            <span class="app-nav-section-title">Geral</span>

            <button type="button" class="app-nav-item" data-nav="admin-usuarios" data-tooltip="Usuários">
              <span class="app-nav-icon"><i data-lucide="users" width="20" height="20"></i></span>
              <span class="app-nav-label">Usuários</span>
            </button>

            <!-- Assinantes (expansível: Planos / Assinantes / Histórico) -->
            <div class="app-nav-group" id="group-assinantes">
              <button type="button" class="app-nav-item" data-group-toggle="group-assinantes" aria-expanded="false" data-tooltip="Assinantes · opções">
                <span class="app-nav-icon"><i data-lucide="credit-card" width="20" height="20"></i></span>
                <span class="app-nav-label">Assinantes</span>
                <span class="app-nav-chevron"><i data-lucide="chevron-down" width="16" height="16"></i></span>
              </button>
              <div class="app-nav-submenu">
                <button type="button" class="app-nav-subitem" data-nav="admin-assinantes-planos">
                  <span class="app-nav-icon"><i data-lucide="layers" width="16" height="16"></i></span>
                  <span class="app-nav-label">Planos</span>
                </button>
                <button type="button" class="app-nav-subitem" data-nav="admin-assinantes-lista">
                  <span class="app-nav-icon"><i data-lucide="user-check" width="16" height="16"></i></span>
                  <span class="app-nav-label">Assinantes</span>
                </button>
                <button type="button" class="app-nav-subitem" data-nav="admin-assinantes-historico">
                  <span class="app-nav-icon"><i data-lucide="history" width="16" height="16"></i></span>
                  <span class="app-nav-label">Histórico</span>
                </button>
              </div>
            </div>

            <button type="button" class="app-nav-item" data-nav="admin-cupons" data-tooltip="Cupons e afiliados">
              <span class="app-nav-icon"><i data-lucide="ticket-percent" width="20" height="20"></i></span>
              <span class="app-nav-label">Cupons e afiliados</span>
            </button>

            <button type="button" class="app-nav-item" data-nav="admin-videos" data-tooltip="Vídeos">
              <span class="app-nav-icon"><i data-lucide="circle-play" width="20" height="20"></i></span>
              <span class="app-nav-label">Vídeos</span>
            </button>

            <button type="button" class="app-nav-item" data-nav="admin-canal-ideias" data-tooltip="Canal de ideias">
              <span class="app-nav-icon"><i data-lucide="lightbulb" width="20" height="20"></i></span>
              <span class="app-nav-label">Canal de ideias</span>
            </button>

            <button type="button" class="app-nav-item app-nav-item-exit" data-nav="admin-sair" data-tooltip="Sair">
              <span class="app-nav-icon"><i data-lucide="log-out" width="20" height="20"></i></span>
              <span class="app-nav-label">Sair</span>
            </button>
          </div>

        </nav>

        <div class="app-sidebar-footer">
          <span class="app-sidebar-version">Versão 1.0.0</span>
        </div>
      </aside>

      <!-- ══════════════════ CONTEÚDO PRINCIPAL (placeholder) ══════════════════ -->
      <main class="app-main">
        <div class="app-main-placeholder">
          <h1 class="app-main-placeholder-title">Área de conteúdo principal</h1>
          <p class="app-main-placeholder-text">
            Esta etapa cobre apenas a estrutura global de navegação do painel
            administrativo (Header + Sidebar). Nenhum item começa selecionado
            por padrão — o conteúdo de cada seção será construído em etapas
            futuras.
          </p>
        </div>
      </main>

    </div>

  </div>

  <div class="app-tooltip text-12-regular" id="app-tooltip" role="tooltip"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../shared/admin-shell.js"></script>
</body>
</html>
