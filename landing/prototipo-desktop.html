<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototype Desktop — Nivelo</title>
  <link rel="stylesheet" href="shared/prototipo-desktop.css" />
</head>
<body>
  <p class="proto-label">Desktop · 1440px</p>

  <div class="proto-browser">
    <div class="proto-browser-bar">
      <div class="proto-browser-dots">
        <span class="dot-red"></span>
        <span class="dot-yellow"></span>
        <span class="dot-green"></span>
      </div>
      <div class="proto-browser-address">nivelo.com.br</div>
    </div>
    <div class="proto-browser-screen">
      <iframe
        src="screens/index.html"
        title="Nivelo Landing Page — Desktop"
      ></iframe>
    </div>
  </div>

  <a href="prototipo.html" class="proto-switch">Ver versão Mobile</a>
</body>
</html>
