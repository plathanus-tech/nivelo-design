<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="../shared/nav-sync.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validar telefone — Nivelo</title>

  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../../Storybook-Nivelo/src/tokens/tokens.css" />
  <link rel="stylesheet" href="../../Storybook-Nivelo/src/tokens/typography.css" />
  <link rel="stylesheet" href="../../Storybook-Nivelo/src/components/Input/Input.module.css" />
  <link rel="stylesheet" href="../../Storybook-Nivelo/src/components/Button/Button.module.css" />
  <link rel="stylesheet" href="../../Storybook-Nivelo/src/components/Feedback/Feedback.module.css" />
  <link rel="stylesheet" href="../shared/page-login.css" />
  <link rel="stylesheet" href="../shared/page-codigo-verificacao.css" />
  <link rel="stylesheet" href="../shared/page-cadastro.css" />
</head>
<body class="login-screen">

  <div class="login-shell">

    <aside class="login-panel" aria-hidden="true">
      <img class="login-panel-img" src="../../gestão com nivelo melhora.png" alt="" />
      <div class="login-panel-overlay"></div>
    </aside>

    <main class="login-page">
    <img class="login-logo" src="../../NIVELO azul header.svg" alt="Nivelo" />
    <div class="login-card">

      <ol class="cadastro-steps" aria-label="Etapas do cadastro">
        <li class="cadastro-step is-current" data-step="1">
          <span class="cadastro-step-circle text-12-bold">1</span>
          <span class="cadastro-step-label text-10-medium">Cadastro</span>
        </li>
        <li class="cadastro-step-connector"></li>
        <li class="cadastro-step" data-step="2">
          <span class="cadastro-step-circle text-12-bold">2</span>
          <span class="cadastro-step-label text-10-medium">Endereço</span>
        </li>
        <li class="cadastro-step-connector"></li>
        <li class="cadastro-step" data-step="3">
          <span class="cadastro-step-circle text-12-bold">3</span>
          <span class="cadastro-step-label text-10-medium">Plano</span>
        </li>
      </ol>

      <header class="login-header">
        <h1 class="login-title text-heading-6">Validar telefone</h1>
        <p class="login-sub">
          Enviamos um código de 6 dígitos para o WhatsApp do número
          <strong id="signup-otp-phone">(11) •••••-4321</strong>
        </p>
      </header>

      <!-- Feedback: código expirado -->
      <div class="alert warning login-alert" role="alert" id="signup-otp-expired-banner" hidden>
        <span class="icon"><i data-lucide="triangle-alert" width="18" height="18"></i></span>
        <div class="body">
          <div class="title">Seu código expirou</div>
        </div>
      </div>

      <form class="login-form" id="signup-otp-form" data-state="idle" novalidate>

        <div class="otp-group" id="signup-otp-group">
          <div class="otp-inputs" role="group" aria-label="Código de verificação de 6 dígitos">
            <input class="input otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" autocomplete="one-time-code" aria-label="Dígito 1" data-otp-index="0" />
            <input class="input otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 2" data-otp-index="1" />
            <input class="input otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 3" data-otp-index="2" />
            <input class="input otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 4" data-otp-index="3" />
            <input class="input otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 5" data-otp-index="4" />
            <input class="input otp-digit" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito 6" data-otp-index="5" />
          </div>
          <span class="errorText otp-error" id="signup-otp-error">
            <i data-lucide="circle-x" width="14" height="14" class="msgIcon"></i>
            <span class="otp-error-text">Digite os 6 números do código.</span>
          </span>
        </div>

        <div class="otp-countdown" id="signup-otp-countdown">
          <span class="otp-countdown-label">Código expira em:</span>
          <span class="otp-countdown-time" id="signup-otp-countdown-time">04:59</span>
        </div>

        <p class="otp-resend">
          Não recebeu o código?
          <button type="button" class="otp-resend-link" id="signup-otp-resend-btn">Reenviar código</button>
        </p>

        <div class="login-button-row">
          <button type="submit" class="btn primary login-submit login-full-btn" id="signup-otp-submit" disabled>
            <span class="login-submit-label">Validar código</span>
            <span class="login-submit-label-retry">Enviar novo código</span>
            <span class="login-submit-spinner" aria-hidden="true"></span>
          </button>

          <a href="cadastro.html" class="btn secondary login-full-btn" id="signup-otp-back-link">
            Voltar
          </a>
        </div>
      </form>

    </div>
    </main>

  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../shared/cadastro-validar-telefone.js"></script>
</body>
</html>
